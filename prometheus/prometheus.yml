global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'api-server'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-server:3000']

  - job_name: 'worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9100']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
    basic_auth:
      username: ${MINIO_ROOT_USER}
      password: ${MINIO_ROOT_PASSWORD}
