name: Build docker images and push them into ghcr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    name: Build and push docker images
    runs-on: ubuntu-latest
    strategy:
      ## instead of running the same job for each service, we can use matrix to run the same job for all services parallely
      matrix:
        service: [api-server, worker, frontend]

    ## Permission to read the code and write the package to ghcr
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/video-editor-${{ matrix.service }}:latest

